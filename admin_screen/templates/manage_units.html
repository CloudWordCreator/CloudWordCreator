<!DOCTYPE html>
<html lang="ja">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>{{ text.name }} - Unit管理</title>
    <!-- 既存のCSSを流用、もしあれば管理画面用CSSを作成 -->
    <link rel="stylesheet" href="{% static 'admin_screen/css/edit_text_style.css' %}">
    <link rel="shortcut icon" href="{% static 'images/icon.png' %}" type="logo.icon" />
    <link rel="icon" href="{% static 'images/icon.png' %}" type="logo.icon" />
</head>

<body>
    <div class="buttons">
        <!-- 戻る先はテキスト編集画面 -->
        <a href="{% url 'edit_text' %}?text-id={{ text.id }}">
            <img src="{% static 'admin_screen/images/back.png' %}" alt="戻る">
        </a>
    </div>

    <h1>{{ text.name }} - Unit一覧</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>名前</th>
                <th>親Unit</th>
                <th>アクション</th>
            </tr>
        </thead>
        <tbody>
            {% for unit in units %}
            <tr>
                <td>{{ unit.id }}</td>
                <td>{{ unit.name }}</td>
                <td>
                    {% if unit.parent %}
                    {{ unit.parent.name }}
                    {% else %}
                    -
                    {% endif %}
                </td>
                <td>
                    <a href="{% url 'edit_unit' %}?unit_id={{ unit.id }}">編集</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Unitがありません。</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
