<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Admin Home</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/primevue@4/umd/primevue.min.js"></script>
    <script src="https://unpkg.com/@primevue/themes/umd/aura.min.js"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'admin_screen/css/admin home_style.css' %}">
</head>

<body>
    <!-- React App Root -->
    <div id="root"></div>

    <!-- Load React Assets -->
    <link rel="stylesheet" href="{% static 'result_frontend/assets/index.css' %}">
    <script type="module" src="{% static 'result_frontend/assets/index.js' %}"></script>

    <div class="admin-home-container">
        <div class="text-list">
            <!-- 教材リスト 表示まで実装 js等の設定はまだ -->
            <div class="unit-text">
                <!-- unitで分類された教材 -->
                <h2>Unit:</h2>
                <ul>
                    {% for text in unit_texts %}
                    <li class="text-item" id='text-{{ text.id }}'>
                        <span>{{ text.name }}</span>
                        <!-- 編集ボタン -->
                        <button id='edit-{{ text.id }}' class="edit-button"
                            onclick="location.href='{% url 'edit_text' %}?text-id={{ text.id }}'">
                            <i class="pi pi-pen-to-square" style="font-size: 1.5em;"></i>
                        </button>
                        <!-- 削除ボタン -->
                        <button id='delete-{{ text.id }}' class="delete-button"
                            onclick="location.href='{% url 'delete_text' %}?text_id={{ text.id }}'">
                            <i class="pi pi-trash" style="font-size: 1.5em;"></i>
                        </button>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            <div class="nounit-text">
                <!-- unitで分類されていない教材 -->
                <h2>No Unit:</h2>
                <ul>
                    {% for text in no_unit_texts %}
                    <li class="text-item" id='text-{{ text.id }}'>
                        <span>{{ text.name }}</span>
                        <!-- 編集ボタン -->
                        <button id='edit-{{ text.id }}' class="edit-button"
                            onclick="location.href='{% url 'edit_text' %}?text-id={{ text.id }}'">
                            <i class="pi pi-pen-to-square" style="font-size: 1.5em;"></i>
                        </button>
                        <!-- 削除ボタン -->
                        <button id='delete-{{ text.id }}' class="delete-button"
                            onclick="location.href='{% url 'delete_text' %}?text_id={{ text.id }}'">
                            <i class="pi pi-trash" style="font-size: 1.5em;"></i>
                        </button>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <div class="csvForm">
            <a href="{% url 'upload_csv' %}" target="_blank" rel="noopener">
                教材をアップロードして追加
                <i class="pi pi-upload" style="font-size: 1em; padding-left:1em;"></i>
            </a>
        </div>
    </div>
    <div id="speeddial">
        <p-speeddial :model="items" :radius="100" type="quarter-circle" direction="down-left"
            tooltipOptions="{ position: 'left', event: 'hover' }"></p-speeddial>
    </div>
    <script src="{% static 'common/js/vue_report_scripts.js' %}" type="module"></script>
    <script>
        document.getElementById('searchInput').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('searchForm').submit();
            }
        });
        function searchText() {
            document.getElementById('searchForm').submit();
        }
    </script>
</body>

</html>
