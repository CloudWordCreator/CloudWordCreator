[uwsgi]
socket = /home/ubuntu/CloudWordCreator/CloudWordCreator.sock
module = CloudWordCreator.wsgi:application
chmod-socket = 666
logto = /var/log/uwsgi/uwsgi.log

chdir = /home/ubuntu/CloudWordCreator
master = true
die-on-term = true
venv = /home/ubuntu/CloudWordCreator/django_env

req-logger = file:/var/log/uwsgi/requests.log
logger = file:/var/log/uwsgi/uwsgi.log
log-format = %(addr) - %(method) %(uri) => generated %(size) bytes in %(msecs) msecs
