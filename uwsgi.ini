[uwsgi]
# プロジェクトのルートディレクトリ
chdir = /home/saba_pennsupinig/CloudWordCreator

# Djangoのwsgiファイル
module = CloudWordCreator.wsgi

# 仮想環境（venv）のパス
home = /home/saba_pennsupinig/CloudWordCreator/venv

# プロセス設定
master = true
processes = 2  # GCEのスペックに合わせて調整（ログでは4になってますが1〜2で十分です）

# ソケット設定（以前決めた通り /tmp に置くのが安全です）
socket = /tmp/cloudwordcreator.sock
chmod-socket = 666
vacuum = true

# デーモン化とログ
daemonize = /home/saba_pennsupinig/CloudWordCreator/logs/uwsgi.log
pidfile = /tmp/cloudwordcreator.pid
