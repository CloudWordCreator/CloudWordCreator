<!DOCTYPE html>
<html lang="ja">
<head>
    <title>検索結果</title>
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/primevue@4/umd/primevue.min.js"></script>
    <script src="https://unpkg.com/@primevue/themes/umd/aura.min.js"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'flatTestMaker/css/flatTest_search_style.css' %}">
    <link rel="stylesheet" href="{%  static 'common/css/speeddial.css' %}">
    <link rel="shortcut icon" href="{% static 'images/icon.png' %}" type="logo.icon" />
    <link rel="icon" href="{% static 'images/icon.png' %}" type="logo.icon" />
</head>
<body>
    <div id="speeddial">
        <p-speeddial :model="items" :radius="100" type="quarter-circle" direction="down-left" tooltipOptions="{ position: 'left', event: 'hover' }" />
    </div>
    <script src="{% static 'common/js/vue_report_scripts.js' %}" type="module"></script>
    <h1>検索結果</h1>
    <table>
        <tr>
            <th>テキスト</th>
            <th>番号</th>
            <th>単語</th>
            <th>意味</th>
        </tr>
        {% for result in results %}
        <tr>
            <td>{{ result.text.name }}</td>
            <td>{{ result.no }}</td>
            <td>{{ result.english }}</td>
            <td>{{ result.japanese }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">該当する結果はありません。</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
